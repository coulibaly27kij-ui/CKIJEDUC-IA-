<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="258405" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Educatif</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #input-area { display: flex; gap: 5px; }
        input { flex-grow: 1; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>

    <h2>Chat avec ton IA</h2>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Pose ta question...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // 1. INSÈRE TA CLÉ API ICI
        const API_KEY = "AQ.Ab8RN6JHdqIhVnHvFCKVwI2xxdnXx43-GGpJr-bxiWK9APg2rQ"; 
        const genAI = new GoogleGenerativeAI(API_KEY);

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const message = input.value;
            
            if (!message) return;

            chatBox.innerHTML += `<p><b>Toi:</b> ${message}</p>`;
            input.value = "";

            try {
                const model = genAI.getGenerativeModel({ model: "gemini-pro" });
                const result = await model.generateContent(message);
                const response = await result.response;
                chatBox.innerHTML += `<p><b>IA:</b> ${response.text()}</p>`;
            } catch (error) {
                chatBox.innerHTML += `<p style="color:red;">Erreur: Impossible de contacter l'IA.</p>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
