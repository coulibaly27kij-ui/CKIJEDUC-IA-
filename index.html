    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Educatif</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #input-area { display: flex; gap: 5px; }
        input { flex-grow: 1; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>

    <h2>Chat avec ton IA</h2>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Pose ta question...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

<script>
async function sendMessage() {
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const message = input.value;
    
    if (!message) return;
    
    chatBox.innerHTML += `<p><b>Toi :</b> ${message}</p>`;
    input.value = "";

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        
        const data = await response.json();
        
        if (data.reply) {
            chatBox.innerHTML += `<p><b>IA :</b> ${data.reply}</p>`;
        } else {
            chatBox.innerHTML += `<p style="color:red;">Erreur : ${data.error || 'Impossible de générer une réponse.'}</p>`;
        }
    } catch (error) {
        chatBox.innerHTML += `<p style="color:red;">Erreur : Impossible de contacter le serveur.</p>`;
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
}
// Rend la fonction accessible au bouton HTML
window.sendMessage = sendMessage;
</script>

</body>
</html>
